name: Android CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Core flows on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.combustible12.healthtrend/files/qa-symptom.png qa-symptom.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HealthTrend-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa-symptom.png
      - uses: actions/upload-artifact@v4
        with:
          name: HealthTrend-debug
          path: app/build/outputs/apk/debug/app-debug.apk
