name: Android CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check persistent signing configuration
        env:
          KEY: ${{ secrets.HEALTHTREND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEALTHTREND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTHTREND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEALTHTREND_KEY_PASSWORD }}
        run: |
          python - <<'PYTHON'
          import os,base64,pathlib
          names=['KEY','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']
          missing=[n for n in names if not os.environ.get(n)]
          pathlib.Path('signing-readiness.txt').write_text('Missing signing configuration: '+', '.join(missing) if missing else 'Persistent signing configuration is present')
          if not missing:
              key=pathlib.Path(os.environ['RUNNER_TEMP'])/'healthtrend.jks'
              key.write_bytes(base64.b64decode(os.environ['KEY']))
              with open(os.environ['GITHUB_ENV'],'a') as env:
                  env.write('HEALTHTREND_KEYSTORE_PATH='+str(key)+'\n')
                  for source,target in [('STORE_PASSWORD','HEALTHTREND_STORE_PASSWORD'),('KEY_ALIAS','HEALTHTREND_KEY_ALIAS'),('KEY_PASSWORD','HEALTHTREND_KEY_PASSWORD')]:
                      env.write(target+'='+os.environ[source]+'\n')
          PYTHON
          cat signing-readiness.txt
      - name: Unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare newer APKs for update signature validation
        run: |
          HEALTHTREND_VERSION_CODE="$((GITHUB_RUN_NUMBER + 100000))" gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/qa-update-same-signer.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/qa-different-signer.jks" -storepass qa-test-password -keypass qa-test-password -alias qa -dname "CN=HealthTrend QA" -keyalg RSA -validity 30
          qa_apksigner="$(python -c "import os,pathlib; print(sorted(pathlib.Path(os.environ['ANDROID_HOME']).glob('build-tools/*/apksigner'))[-1])")"
          "$qa_apksigner" sign --ks "$RUNNER_TEMP/qa-different-signer.jks" --ks-pass pass:qa-test-password --key-pass pass:qa-test-password --out "$RUNNER_TEMP/qa-update-wrong-signer.apk" "$RUNNER_TEMP/qa-update-same-signer.apk"
          gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build v1 baseline with the same test signing identity
        run: |
          git fetch origin 8365a97f69663c20f765cef26de1784a4eaf5de1
          git worktree add /tmp/HealthTrend-baseline 8365a97f69663c20f765cef26de1784a4eaf5de1
          gradle -I "$GITHUB_WORKSPACE/ci/baseline-signing.gradle" -p /tmp/HealthTrend-baseline :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Core flows on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install /tmp/HealthTrend-baseline/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.combustible12.healthtrend/.MainActivity
            adb shell am force-stop com.combustible12.healthtrend
            adb push app/src/androidTest/assets/v1-prefs.xml /data/local/tmp/healthtrend-v1.xml
            adb shell run-as com.combustible12.healthtrend mkdir -p shared_prefs
            adb shell run-as com.combustible12.healthtrend cp /data/local/tmp/healthtrend-v1.xml shared_prefs/healthtrend_store_v1.xml
            base64 -d ci/fixtures/v1-image.b64 > /tmp/v1-image.png
            adb push /tmp/v1-image.png /data/local/tmp/healthtrend-v1.png
            adb shell run-as com.combustible12.healthtrend mkdir -p files/sources
            adb shell run-as com.combustible12.healthtrend cp /data/local/tmp/healthtrend-v1.png files/sources/v1.png
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.combustible12.healthtrend.UpgradeTest com.combustible12.healthtrend.test/androidx.test.runner.AndroidJUnitRunner > upgrade-result.txt
            cat upgrade-result.txt
            python -c "from pathlib import Path; assert 'OK (1 test)' in Path('upgrade-result.txt').read_text(), 'Actual upgrade validation failed'"
            adb shell run-as com.combustible12.healthtrend mkdir -p cache
            adb push "$RUNNER_TEMP/qa-update-same-signer.apk" /data/local/tmp/qa-update-same-signer.apk
            adb push "$RUNNER_TEMP/qa-update-wrong-signer.apk" /data/local/tmp/qa-update-wrong-signer.apk
            adb shell run-as com.combustible12.healthtrend cp /data/local/tmp/qa-update-same-signer.apk cache/qa-update-same-signer.apk
            adb shell run-as com.combustible12.healthtrend cp /data/local/tmp/qa-update-wrong-signer.apk cache/qa-update-wrong-signer.apk
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.combustible12.healthtrend.UpgradeTest && test_status=0 || test_status=$?; adb pull /sdcard/Pictures/HealthTrendQA/qa-symptom.png qa-symptom.png; python -c "import base64,pathlib; data=base64.b64encode(pathlib.Path('qa-symptom.png').read_bytes()).decode(); [print('QA_PNG:'+data[i:i+4096]) for i in range(0,len(data),4096)]"; exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HealthTrend-verification-android-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa-symptom.png
            signing-readiness.txt
            upgrade-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HealthTrend-debug-android-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
