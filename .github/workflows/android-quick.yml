name: Android build and release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: healthtrend-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key
        env:
          KEY: ${{ secrets.HEALTHTREND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEALTHTREND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTHTREND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEALTHTREND_KEY_PASSWORD }}
        run: |
          test -n "$KEY" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/healthtrend.jks"
          echo "HEALTHTREND_KEYSTORE_PATH=$RUNNER_TEMP/healthtrend.jks" >> "$GITHUB_ENV"
          echo "HEALTHTREND_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HEALTHTREND_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HEALTHTREND_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verify persistent signing key
        run: java ci/VerifySigning.java
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build signed APK
        run: HEALTHTREND_VERSION_CODE=2026100418 gradle :app:assembleDebug
      - name: Set version
        id: ver
        run: |
          echo "code=2026100418" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HealthTrend.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: HealthTrend ${{ steps.ver.outputs.code }}
          body: |
            版本代码: ${{ steps.ver.outputs.code }}
            构建时间: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          files: HealthTrend.apk
          draft: false
          prerelease: false
