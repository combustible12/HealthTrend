name: Android quick check
on:
  push:
    branches: [ main ]
    paths-ignore:
      - release/ready.json
      - ci/acceptance.json
  workflow_dispatch:
concurrency:
  group: healthtrend-quick-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile-and-unit-test:
    name: Compile, unit tests and test APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile app and instrumentation tests; run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebugAndroidTest
