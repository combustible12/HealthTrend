name: Android build and release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: healthtrend-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Set version
        id: ver
        run: |
          echo "code=100000" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HealthTrend.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: HealthTrend ${{ steps.ver.outputs.code }}
          body: |
            版本代码: ${{ steps.ver.outputs.code }}
            构建时间: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          files: HealthTrend.apk
          draft: false
          prerelease: false
