name: Android compile check
on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/compile-trigger.txt'
concurrency:
  group: healthtrend-compile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    name: Compile debug sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --tests '*ReportParserTest*'
