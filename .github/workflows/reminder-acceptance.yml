name: Course reminder Android acceptance
on:
  push:
    branches: [main]
    paths: [ci/reminder-acceptance.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run JVM regression tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify reminder on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.combustible12.healthtrend.CourseNavigationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-reminder-acceptance
          path: |
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
