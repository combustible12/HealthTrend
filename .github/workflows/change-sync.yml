name: Change synchronization guard
on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'docs/**'
      - 'ci/check_change_sync.py'
      - '.github/workflows/change-sync.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'docs/**'
      - 'ci/check_change_sync.py'
      - '.github/workflows/change-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify policy checker self-tests
        run: python3 ci/check_change_sync.py --self-test
      - name: Enforce synchronized source, tests and current docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_SHA="HEAD^"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Missing base commit ${BASE_SHA}; refusing unverified sync"; exit 2
          fi
          python3 ci/check_change_sync.py --base "$BASE_SHA"
