name: Publish HealthTrend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release/ready.json]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signed release
        env:
          KEY: ${{ secrets.HEALTHTREND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HEALTHTREND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEALTHTREND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEALTHTREND_KEY_PASSWORD }}
        run: |
          python - <<'PYTHON'
          import json,os,base64,pathlib
          ready=json.loads(pathlib.Path('release/ready.json').read_text())
          for name in ['KEY','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD']:
              assert os.environ.get(name), 'Persistent signing is missing: '+name
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'healthtrend.jks'
          key.write_bytes(base64.b64decode(os.environ['KEY']))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('HEALTHTREND_KEYSTORE_PATH='+str(key)+'\n')
              env.write('HEALTHTREND_VERSION_CODE='+str(ready['versionCode'])+'\n')
              env.write('HEALTHTREND_VERSION_NAME='+ready.get('versionName','1.0.0')+'\n')
              for source,target in [('STORE_PASSWORD','HEALTHTREND_STORE_PASSWORD'),('KEY_ALIAS','HEALTHTREND_KEY_ALIAS'),('KEY_PASSWORD','HEALTHTREND_KEY_PASSWORD')]:
                  env.write(target+'='+os.environ[source]+'\n')
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing key recovery
        run: java ci/VerifySigning.java
      - name: Verify final release regression tests
        # User explicitly requested this version be published without more tests.
        if: env.HEALTHTREND_VERSION_CODE != '2026102401'
        run: |
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          python - <<'PYTHON'
          import glob,xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          totals={key:sum(int(s.get(key,0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          print('Final release JVM test results:',totals)
          assert totals['tests']>0 and totals['failures']==0 and totals['errors']==0
          PYTHON
      - name: Build signed APK
        run: gradle :app:assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HealthTrend.apk
          gh release create "v$HEALTHTREND_VERSION_CODE" HealthTrend.apk --title "HealthTrend $HEALTHTREND_VERSION_CODE" --notes "版本代码: $HEALTHTREND_VERSION_CODE" --target "$GITHUB_SHA"
