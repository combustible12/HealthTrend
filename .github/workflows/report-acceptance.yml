name: Report module Android acceptance
on:
  pull_request:
    paths:
      - 'ci/report-acceptance.json'
      - '.github/workflows/report-acceptance.yml'
  push:
    paths: [ci/report-acceptance.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: All JVM regression tests and current UI test APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run current report flows and layout tests on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell am force-stop com.android.launcher3
            adb logcat -G 16M
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.combustible12.healthtrend.TrendRenderingTest,com.combustible12.healthtrend.ReportModuleAcceptanceTest,com.combustible12.healthtrend.TextResultTrendTest,com.combustible12.healthtrend.TrendMeaningLayoutTest,com.combustible12.healthtrend.MetricPurposeInteractionTest,com.combustible12.healthtrend.BloodGroupLayoutTest,com.combustible12.healthtrend.TrendAliasInteractionTest,com.combustible12.healthtrend.CourseNavigationTest && report_test_status=0 || report_test_status=$?; adb logcat -d -s REPORT_QA:I > report-qa.log; adb pull /sdcard/Android/data/com.combustible12.healthtrend/files/report-qa report-qa || true; exit "$report_test_status"
      - name: Gather screenshots
        if: always()
        run: adb pull /sdcard/Android/data/com.combustible12.healthtrend/files/report-qa report-qa || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-module-acceptance
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            report-qa/
            report-qa.log
